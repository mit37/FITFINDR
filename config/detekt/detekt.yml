build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 25

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  MaxLineLength:
    maxLineLength: 140

naming:
  active: true
  FunctionNaming:
    # Jetpack Compose functions are conventionally PascalCase (they read as
    # implicit UI components); see .editorconfig's matching ktlint
    # exception for the same rationale.
    ignoreAnnotated: ["Composable"]
