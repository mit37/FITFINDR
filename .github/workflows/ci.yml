name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: lint, detekt, unit tests, assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners ship with the Android SDK preinstalled
      # (ANDROID_HOME set, licenses pre-accepted, cmdline-tools available).
      # AGP downloads any additional platform/build-tools version it needs
      # via that preinstalled sdkmanager during the Gradle build itself, so
      # no separate setup action is required. (We previously used
      # android-actions/setup-android@v3 here, but it fails outright: by
      # default it runs `sdkmanager tools`, and Google removed the legacy
      # "tools" package from the SDK repository, so the step always exits 1
      # before any real check runs.)

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: ktlint
        run: ./gradlew ktlintCheck --no-daemon

      - name: detekt
        run: ./gradlew detekt --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: assembleDebug
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports
          retention-days: 14
